name: Deploy API a BanaHosting

on:
  workflow_dispatch:
  push:
    branches:
      - claude/dominican-citizen-app-expansion-t2lw0v
      - main
    paths:
      - 'api-php/**'
      - 'webapp/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Subir api-php por FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: single2480a.banahosting.com
          username: vmdventura@amsmultimedia.com
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: api-php/
          server-dir: vmdventura.com/ciudadanoRD/
          exclude: |
            **/cache/**

      - name: Subir webapp por FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: single2480a.banahosting.com
          username: vmdventura@amsmultimedia.com
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: webapp/
          server-dir: vmdventura.com/ciudadanoRD/app/
