name: Deploy API a BanaHosting

on:
  workflow_dispatch:
  push:
    branches:
      - claude/dominican-citizen-app-expansion-t2lw0v
      - main
    paths:
      - 'api-php/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Listar estructura del servidor
        env:
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get install -y -q lftp > /dev/null 2>&1
          lftp -u "vmdventura@amsmultimedia.com,$FTP_PASS" ftp://single2480a.banahosting.com -e "
            set ssl:verify-certificate no;
            echo '=== RAIZ ==='; cls -la /;
            echo '=== /vmdventura.com ==='; cls -la /vmdventura.com || true;
            echo '=== /public_html ==='; cls -la /public_html || true;
            quit" || true

      - name: Subir api-php por FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: single2480a.banahosting.com
          username: vmdventura@amsmultimedia.com
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: api-php/
          server-dir: ciudadanoRD/
